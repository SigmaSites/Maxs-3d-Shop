<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Farben</title>
<style>
:root{color-scheme:light dark;--bg:#f2f4f3;--surface:#fff;--text:#1d2a27;--muted:#5c6b67;--line:#d5dcda;--accent:#0f7b6c;--accent-text:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#151b1a;--surface:#1e2725;--text:#e6eeec;--muted:#9bada8;--line:#33413e;--accent:#3fc0ab;--accent-text:#0b1513}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.6rem;margin:0}.sub{color:var(--muted);margin:4px 0 14px}
input,select,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}.nav,.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.nav button[aria-pressed=true],.color-card button[aria-pressed=true]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.bar input{flex:1;min-width:160px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.color-card{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.swatch{height:110px;border-bottom:1px solid var(--line)}
.info{padding:10px}.info b{display:block;overflow-wrap:anywhere}.info small{display:block;color:var(--muted);overflow-wrap:anywhere;margin:3px 0 8px}
.info button{width:100%}.front{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.front-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.front-swatch{height:100px;border-radius:8px;border:1px solid var(--line)}.front-card b{display:block;margin:8px 0;overflow-wrap:anywhere}
.none{padding:16px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;text-align:center}.status{font-size:.85rem;color:var(--muted)}[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Meine Farben</h1><span id="count" class="status"></span></div>
  <p class="sub">Filamente werden live aus deiner Firebase Realtime Database geladen.</p>
  <div class="nav" aria-label="Ansicht">
    <button id="catalogTab" aria-pressed="true">Alle Farben</button>
    <button id="frontTab" aria-pressed="false">Ausgewählte Farben</button>
  </div>
  <section id="catalogView">
    <div class="bar">
      <input type="search" id="q" placeholder="Farbe suchen …" aria-label="Farbe suchen">
      <select id="sort" aria-label="Sortierung">
        <option value="name">Nach Name sortieren</option>
        <option value="color">Nach Farbwert sortieren</option>
      </select>
    </div>
    <div id="status" class="status">Verbindung wird hergestellt …</div>
    <div id="list" class="grid"></div>
  </section>
  <section id="frontView" hidden>
    <p class="sub">Hier erscheinen die Farben, die du ausgewählt hast.</p>
    <div id="front" class="front"></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

/* Ersetze die Beispielwerte durch die Konfiguration aus Firebase:
   Firebase Console → Projekteinstellungen → Deine Apps → SDK-Einrichtung */
const firebaseConfig = {
  apiKey: "DEIN_API_KEY",
  authDomain: "DEIN_PROJEKT.firebaseapp.com",
  databaseURL: "DEINE_DATABASE_URL",
  projectId: "DEIN_PROJEKT",
  appId: "DEINE_APP_ID"
};

const $ = id => document.getElementById(id);
const STORAGE_KEY = "firebase_farben_auswahl_v1";
let farben = [];
let selected = new Set();
try { selected = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")); } catch {}

function isHex(value) {
  return typeof value === "string" && /^#(?:[0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(value.trim());
}

/* Erwartete Datenstruktur:
   filaments/0/color = "Schwarz"
   filaments/0/hex = "#000000"
   filaments/0/material = "PLA" */
function parseColors(data) {
  if (!data || typeof data !== "object") return [];
  return Object.entries(data).map(([key, value]) => {
    if (!value || typeof value !== "object") return null;
    const name = typeof value.color === "string" ? value.color : key;
    const hex = typeof value.hex === "string" ? value.hex.trim() : "";
    const material = typeof value.material === "string" ? value.material : "";
    if (!isHex(hex)) return null;
    return { id:key, name, hex:hex.toLowerCase(), material };
  }).filter(Boolean).sort((a,b) => a.name.localeCompare(b.name, "de"));
}
function saveSelection() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...selected])); } catch {}
  $("count").textContent = selected.size ? `${selected.size} ausgewählt` : `${farben.length} Farben`;
}

function renderList() {
  const words = $("q").value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  let items = farben.filter(c => words.every(w => `${c.name} ${c.hex} ${c.material}`.toLowerCase().includes(w)));
  if ($("sort").value === "color") items.sort((a,b) => a.hex.localeCompare(b.hex));
  const list = $("list");
  list.replaceChildren();
  if (!items.length) {
    list.innerHTML = '<div class="none">Keine passenden Farben gefunden. Prüfe auch die Datenstruktur in Firebase.</div>';
    return;
  }
  items.forEach(c => {
    const card = document.createElement("article");
    card.className = "color-card";
    const swatch = document.createElement("div");
    swatch.className = "swatch";
    swatch.style.backgroundColor = c.hex;
    const info = document.createElement("div");
    info.className = "info";
    const title = document.createElement("b");
    title.textContent = c.name;
    const value = document.createElement("small");
    value.textContent = c.material ? `${c.hex} · ${c.material}` : c.hex;
    const button = document.createElement("button");
    const isSelected = selected.has(c.id);
    button.textContent = isSelected ? "Ausgewählt" : "Auswählen";
    button.setAttribute("aria-pressed", String(isSelected));
    button.onclick = () => {
      selected.has(c.id) ? selected.delete(c.id) : selected.add(c.id);
      saveSelection(); renderList(); renderFront();
    };
    info.append(title, value, button);
    card.append(swatch, info);
    list.append(card);
  });
}

function renderFront() {
  const front = $("front");
  front.replaceChildren();
  const items = farben.filter(c => selected.has(c.id));
  if (!items.length) {
    front.innerHTML = '<div class="none">Noch keine Farben ausgewählt.</div>';
    return;
  }
  items.forEach(c => {
    const card = document.createElement("article");
    card.className = "front-card";
    const swatch = document.createElement("div");
    swatch.className = "front-swatch";
    swatch.style.backgroundColor = c.hex;
    const title = document.createElement("b");
    title.textContent = c.name;
    const value = document.createElement("small");
    value.className = "status";
    value.textContent = c.material ? `${c.hex} · ${c.material}` : c.hex;
    const button = document.createElement("button");
    button.textContent = "Entfernen";
    button.onclick = () => {
      selected.delete(c.id); saveSelection(); renderList(); renderFront();
    };
    card.append(swatch, title, value, button);
    front.append(card);
  });
}

function show(view) {
  const catalog = view === "catalog";
  $("catalogView").hidden = !catalog;
  $("frontView").hidden = catalog;
  $("catalogTab").setAttribute("aria-pressed", String(catalog));
  $("frontTab").setAttribute("aria-pressed", String(!catalog));
  if (!catalog) renderFront();
}

$("catalogTab").onclick = () => show("catalog");
$("frontTab").onclick = () => show("front");
$("q").oninput = renderList;
$("sort").onchange = renderList;

try {
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  onValue(ref(db, "filaments"), snapshot => {
    farben = parseColors(snapshot.val());
    $("status").textContent = farben.length
      ? `${farben.length} Farben erfolgreich geladen.`
      : "Keine lesbaren Filamente gefunden. Prüfe den Ordner „filaments“ und die Datenbankregeln.";
    const validIds = new Set(farben.map(c => c.id));
    selected = new Set([...selected].filter(id => validIds.has(id)));
    saveSelection(); renderList(); renderFront();
  }, error => {
    $("status").textContent = "Firebase-Fehler: " + error.message;
  });
} catch (error) {
  $("status").textContent = "Konfiguration prüfen: Trage deine Firebase-Projektdaten im Code ein. " + error.message;
}
</script>
</body>
</html>
