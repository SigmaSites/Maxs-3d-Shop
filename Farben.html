<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filament-Farben</title>
<style>
:root{
  color-scheme:dark;
  --bg:#101311;
  --surface:#191e1b;
  --surface-hover:#222a25;
  --text:#edf3ef;
  --muted:#9aa79f;
  --line:#303a33;
  --accent:#77e0a2;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top,#1b2920 0%,var(--bg) 55%);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.5;
}
main{max-width:1100px;margin:0 auto;padding:28px 18px 48px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:-.04em;margin:0}
.subtitle{color:var(--muted);margin:5px 0 0}
.count{font-size:.9rem;color:var(--muted);border:1px solid var(--line);background:#171d19;padding:7px 11px;border-radius:999px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input,select{
  font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;
}
input{flex:1;min-width:190px}
select{min-width:160px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}
.card{
  overflow:hidden;background:linear-gradient(145deg,#202722,#171c19);
  border:1px solid var(--line);border-radius:17px;
  box-shadow:0 8px 26px #0002;transition:transform .16s,border-color .16s;
}
.card:hover{transform:translateY(-3px);border-color:#52675a}
.swatch{height:145px;position:relative;border-bottom:1px solid #ffffff18}
.swatch::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff1c,transparent 50%,#00000018)}
.details{padding:14px 15px 16px}
.name{font-size:1.08rem;font-weight:700;overflow-wrap:anywhere}
.material{display:inline-block;margin-top:7px;padding:4px 9px;border-radius:7px;background:#2a352e;color:#bdebc9;font-size:.78rem;font-weight:650}
.hexrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:13px}
.hex{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#c3cec6;font-size:.9rem}
.copy{
  border:1px solid #3a493e;background:#26342a;color:#d9f7e2;
  border-radius:8px;padding:6px 9px;font:inherit;font-size:.8rem;cursor:pointer
}
.copy:hover{background:#314735}
.status{color:var(--muted);font-size:.9rem;margin:12px 0}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
[hidden]{display:none!important}
@media(max-width:480px){main{padding:20px 12px 32px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.swatch{height:105px}.details{padding:11px}.name{font-size:.98rem}.hexrow{align-items:flex-start;flex-direction:column}.copy{width:100%}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Filament-Farben</h1>
      <p class="subtitle">Farben, Materialien und HEX-Werte auf einen Blick.</p>
    </div>
    <div id="count" class="count">Lade …</div>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Farbe, Material oder HEX suchen …" aria-label="Filamente suchen">
    <select id="materialFilter" aria-label="Material filtern">
      <option value="">Alle Materialien</option>
    </select>
  </div>

  <p id="status" class="status">Lade Daten …</p>
  <section id="grid" class="grid" aria-live="polite"></section>
</main>

<script>
/* ===== Nur das hier eintragen: deine Realtime-Database-URL ===== */
const DATABASE_URL = "https://dshop-23436-default-rtdb.europe-west1.firebasedatabase.app/";
/* z. B. "https://dein-projekt-default-rtdb.europe-west1.firebasedatabase.app" */

const PFAD = "filaments";      // Ordner in der Datenbank
const AKTUALISIERUNG_SEK = 20; // automatisch neu laden

const $ = id => document.getElementById(id);
let filaments = [];

function validHex(value){
  return typeof value === "string" &&
    /^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(value.trim());
}

function render(){
  const words = $("search").value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const material = $("materialFilter").value;
  const items = filaments.filter(item =>
    (!material || item.material === material) &&
    words.every(word => `${item.color} ${item.material} ${item.hex}`.toLowerCase().includes(word))
  );

  const grid = $("grid");
  grid.replaceChildren();

  if(!items.length){
    grid.innerHTML = '<div class="empty">Keine passenden Filamente gefunden.</div>';
    return;
  }

  for(const item of items){
    const card = document.createElement("article");
    card.className = "card";

    const swatch = document.createElement("div");
    swatch.className = "swatch";
    swatch.style.backgroundColor = item.hex;

    const details = document.createElement("div");
    details.className = "details";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = item.color;

    const materialLabel = document.createElement("span");
    materialLabel.className = "material";
    materialLabel.textContent = item.material || "Material unbekannt";

    const hexRow = document.createElement("div");
    hexRow.className = "hexrow";

    const hex = document.createElement("code");
    hex.className = "hex";
    hex.textContent = item.hex;

    const copy = document.createElement("button");
    copy.className = "copy";
    copy.textContent = "HEX kopieren";
    copy.onclick = async () => {
      try{
        await navigator.clipboard.writeText(item.hex);
        copy.textContent = "Kopiert!";
        setTimeout(() => copy.textContent = "HEX kopieren", 1300);
      }catch{
        copy.textContent = item.hex;
      }
    };

    hexRow.append(hex, copy);
    details.append(name, materialLabel, hexRow);
    card.append(swatch, details);
    grid.append(card);
  }
}

function updateMaterialFilter(){
  const select = $("materialFilter");
  const current = select.value;
  const materials = [...new Set(filaments.map(f => f.material).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b, "de"));
  select.replaceChildren(new Option("Alle Materialien", ""));
  materials.forEach(material => select.add(new Option(material, material)));
  if(materials.includes(current)) select.value = current;
}

async function load(){
  const base = DATABASE_URL.trim().replace(/\/+$/, "");
  if(!/^https:\/\/.+/.test(base)){
    $("count").textContent = "URL fehlt";
    $("status").textContent = "Trage oben im Code bei DATABASE_URL deine Datenbank-URL ein.";
    return false;
  }
  try{
    const res = await fetch(`${base}/${PFAD}.json`);
    if(res.status === 401 || res.status === 403){
      throw new Error("Zugriff verweigert. In den Firebase-Regeln muss Lesen für „" + PFAD + "“ erlaubt sein.");
    }
    if(!res.ok) throw new Error("Serverantwort " + res.status);
    const data = await res.json() || {};
    filaments = Object.entries(data).map(([id, value]) => ({
      id,
      color: typeof value?.color === "string" ? value.color : id,
      hex: typeof value?.hex === "string" ? value.hex.trim().toUpperCase() : "",
      material: typeof value?.material === "string" ? value.material : ""
    })).filter(item => validHex(item.hex))
      .sort((a,b) => a.color.localeCompare(b.color, "de"));

    $("count").textContent = `${filaments.length} Farben`;
    $("status").textContent = filaments.length
      ? "Mit Firebase verbunden. Aktualisiert alle " + AKTUALISIERUNG_SEK + " Sekunden."
      : "Keine gültigen Filament-Einträge unter „" + PFAD + "“ gefunden.";
    updateMaterialFilter();
    render();
    return true;
  }catch(error){
    $("count").textContent = "Fehler";
    $("status").textContent = "Fehler beim Laden: " + error.message;
    return false;
  }
}

$("search").addEventListener("input", render);
$("materialFilter").addEventListener("change", render);

load().then(ok => { if(ok) setInterval(load, AKTUALISIERUNG_SEK * 1000); });
</script>
</body>
</html>
