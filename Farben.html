<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filament-Farben</title>
<style>
/* ===== Design-Variablen: hier änderst du das ganze Aussehen ===== */
:root{
  color-scheme:dark;

  /* Farben */
  --bg:#101311;
  --surface:#191e1b;
  --surface-2:#222a25;
  --text:#edf3ef;
  --muted:#9aa79f;
  --line:#2c352f;
  --accent:#77e0a2;
  --accent-soft:#1f3328;
  --accent-text:#bdebc9;

  /* Form */
  --radius-s:8px;
  --radius-m:12px;
  --radius-l:16px;
  --shadow:0 6px 20px rgb(0 0 0 / .25);

  /* Abstände */
  --space-1:6px;
  --space-2:10px;
  --space-3:16px;
  --space-4:24px;
  --page-width:1100px;

  /* Schrift */
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;

  /* Karten */
  --card-min:210px;
  --swatch-height:140px;
}

@media (max-width:480px){
  :root{
    --space-3:12px;
    --space-4:18px;
    --card-min:140px;
    --swatch-height:100px;
  }
}

/* ===== Grundlayout ===== */
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  line-height:1.5;
}
main{
  max-width:var(--page-width);
  margin:0 auto;
  padding:var(--space-4) var(--space-3) calc(var(--space-4) * 2);
}
[hidden]{display:none!important}

/* ===== Kopfbereich ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:var(--space-3);
  margin-bottom:var(--space-4);
}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.03em}
.subtitle{margin:var(--space-1) 0 0;color:var(--muted)}
.count{
  padding:var(--space-1) var(--space-2);
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--muted);
  font-size:.875rem;
}

/* ===== Suche und Filter ===== */
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:var(--space-2);
  margin-bottom:var(--space-3);
}
input,select{
  padding:var(--space-2) var(--space-3);
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  font:inherit;
}
input{flex:1;min-width:190px}
select{min-width:160px}
input:focus-visible,select:focus-visible,.copy:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.status{margin:0 0 var(--space-3);color:var(--muted);font-size:.875rem}

/* ===== Karten ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--card-min),1fr));
  gap:var(--space-3);
}
.card{
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-l);
  box-shadow:var(--shadow);
  transition:transform .15s,border-color .15s;
}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.swatch{height:var(--swatch-height);border-bottom:1px solid var(--line)}
.details{padding:var(--space-3)}
.name{font-weight:700;overflow-wrap:anywhere}
.material{
  display:inline-block;
  margin-top:var(--space-1);
  padding:2px var(--space-2);
  background:var(--accent-soft);
  color:var(--accent-text);
  border-radius:var(--radius-s);
  font-size:.75rem;
  font-weight:600;
}
.hexrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:var(--space-2);
  margin-top:var(--space-3);
}
.hex{font-family:var(--mono);font-size:.875rem;color:var(--muted)}
.copy{
  padding:var(--space-1) var(--space-2);
  background:var(--surface-2);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:var(--radius-s);
  font:inherit;
  font-size:.8rem;
  cursor:pointer;
}
.copy:hover{border-color:var(--accent)}
.empty{
  grid-column:1/-1;
  padding:var(--space-4);
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:var(--radius-l);
}

/* ===== Neue Farbe hinzufügen ===== */
.addform{
  margin-bottom:var(--space-4);
  padding:var(--space-3);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-l);
}
.addform h2{margin:0 0 var(--space-2);font-size:1rem}
.fields{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.fields input{flex:1;min-width:140px}
.hexpick{display:flex;gap:var(--space-2);align-items:center}
.hexpick input[type=color]{
  flex:none;min-width:0;width:46px;height:42px;padding:3px;cursor:pointer;
}
.hexpick input[type=text]{width:110px;min-width:0;flex:none;font-family:var(--mono)}
.save{
  padding:var(--space-2) var(--space-3);
  background:var(--accent);
  color:var(--bg);
  border:0;
  border-radius:var(--radius-m);
  font:inherit;
  font-weight:700;
  cursor:pointer;
}
.save:disabled{opacity:.5;cursor:wait}
.save:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.addform .status{margin:var(--space-2) 0 0}
.status.error{color:#ff8a8a}
.status.ok{color:var(--accent)}

@media (max-width:480px){
  .hexrow{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Filament-Farben</h1>
      <p class="subtitle">Farben, Materialien und HEX-Werte auf einen Blick.</p>
    </div>
    <div id="count" class="count">Lade …</div>
  </header>

  <form id="addForm" class="addform" autocomplete="off">
    <h2>Neue Farbe hinzufügen</h2>
    <div class="fields">
      <input id="newColor" placeholder="Farbname (z. B. Signalrot)" maxlength="60" required aria-label="Farbname">
      <input id="newMaterial" list="materials" placeholder="Material (z. B. PLA)" maxlength="30" aria-label="Material">
      <datalist id="materials"></datalist>
      <div class="hexpick">
        <input id="newPicker" type="color" value="#77e0a2" aria-label="Farbe wählen">
        <input id="newHex" type="text" value="#77E0A2" maxlength="7" aria-label="HEX-Wert">
      </div>
      <button id="saveBtn" class="save" type="submit">Speichern</button>
    </div>
    <p id="addMsg" class="status" aria-live="polite"></p>
  </form>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Farbe, Material oder HEX suchen …" aria-label="Filamente suchen">
    <select id="materialFilter" aria-label="Material filtern">
      <option value="">Alle Materialien</option>
    </select>
  </div>

  <p id="status" class="status">Lade Daten …</p>
  <section id="grid" class="grid" aria-live="polite"></section>
</main>

<script>
/* ===== Nur das hier eintragen: deine Realtime-Database-URL ===== */
const DATABASE_URL = "https://dshop-23436-default-rtdb.europe-west1.firebasedatabase.app/";
/* z. B. "https://dein-projekt-default-rtdb.europe-west1.firebasedatabase.app" */

const PFAD = "filaments";      // Ordner in der Datenbank
const AKTUALISIERUNG_SEK = 20; // automatisch neu laden

const $ = id => document.getElementById(id);
let filaments = [];

function validHex(value){
  return typeof value === "string" &&
    /^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(value.trim());
}

function render(){
  const words = $("search").value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const material = $("materialFilter").value;
  const items = filaments.filter(item =>
    (!material || item.material === material) &&
    words.every(word => `${item.color} ${item.material} ${item.hex}`.toLowerCase().includes(word))
  );

  const grid = $("grid");
  grid.replaceChildren();

  if(!items.length){
    grid.innerHTML = '<div class="empty">Keine passenden Filamente gefunden.</div>';
    return;
  }

  for(const item of items){
    const card = document.createElement("article");
    card.className = "card";

    const swatch = document.createElement("div");
    swatch.className = "swatch";
    swatch.style.backgroundColor = item.hex;

    const details = document.createElement("div");
    details.className = "details";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = item.color;

    const materialLabel = document.createElement("span");
    materialLabel.className = "material";
    materialLabel.textContent = item.material || "Material unbekannt";

    const hexRow = document.createElement("div");
    hexRow.className = "hexrow";

    const hex = document.createElement("code");
    hex.className = "hex";
    hex.textContent = item.hex;

    const copy = document.createElement("button");
    copy.className = "copy";
    copy.textContent = "HEX kopieren";
    copy.onclick = async () => {
      try{
        await navigator.clipboard.writeText(item.hex);
        copy.textContent = "Kopiert!";
        setTimeout(() => copy.textContent = "HEX kopieren", 1300);
      }catch{
        copy.textContent = item.hex;
      }
    };

    hexRow.append(hex, copy);
    details.append(name, materialLabel, hexRow);
    card.append(swatch, details);
    grid.append(card);
  }
}

function updateMaterialFilter(){
  const select = $("materialFilter");
  const current = select.value;
  const materials = [...new Set(filaments.map(f => f.material).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b, "de"));
  select.replaceChildren(new Option("Alle Materialien", ""));
  materials.forEach(material => select.add(new Option(material, material)));
  if(materials.includes(current)) select.value = current;
  $("materials").replaceChildren(...materials.map(m => new Option(m)));
}

async function load(){
  const base = DATABASE_URL.trim().replace(/\/+$/, "");
  if(!/^https:\/\/.+/.test(base)){
    $("count").textContent = "URL fehlt";
    $("status").textContent = "Trage oben im Code bei DATABASE_URL deine Datenbank-URL ein.";
    return false;
  }
  try{
    const res = await fetch(`${base}/${PFAD}.json`);
    if(res.status === 401 || res.status === 403){
      throw new Error("Zugriff verweigert. In den Firebase-Regeln muss Lesen für „" + PFAD + "“ erlaubt sein.");
    }
    if(!res.ok) throw new Error("Serverantwort " + res.status);
    const data = await res.json() || {};
    filaments = Object.entries(data).map(([id, value]) => ({
      id,
      color: typeof value?.color === "string" ? value.color : id,
      hex: typeof value?.hex === "string" ? value.hex.trim().toUpperCase() : "",
      material: typeof value?.material === "string" ? value.material : ""
    })).filter(item => validHex(item.hex))
      .sort((a,b) => a.color.localeCompare(b.color, "de"));

    $("count").textContent = `${filaments.length} Farben`;
    $("status").textContent = filaments.length
      ? "Mit Firebase verbunden. Aktualisiert alle " + AKTUALISIERUNG_SEK + " Sekunden."
      : "Keine gültigen Filament-Einträge unter „" + PFAD + "“ gefunden.";
    updateMaterialFilter();
    render();
    return true;
  }catch(error){
    $("count").textContent = "Fehler";
    $("status").textContent = "Fehler beim Laden: " + error.message;
    return false;
  }
}

/* ===== Neue Farbe speichern ===== */
function addMessage(text, type){
  const el = $("addMsg");
  el.textContent = text;
  el.className = "status" + (type ? " " + type : "");
}

$("newPicker").addEventListener("input", () => {
  $("newHex").value = $("newPicker").value.toUpperCase();
});
$("newHex").addEventListener("input", () => {
  const v = $("newHex").value.trim();
  if(/^#[0-9a-f]{6}$/i.test(v)) $("newPicker").value = v;
});

$("addForm").addEventListener("submit", async event => {
  event.preventDefault();
  const color = $("newColor").value.trim();
  const material = $("newMaterial").value.trim();
  let hex = $("newHex").value.trim().toUpperCase();
  if(hex && !hex.startsWith("#")) hex = "#" + hex;

  if(!color) return addMessage("Bitte einen Farbnamen eingeben.", "error");
  if(!validHex(hex)) return addMessage("Der HEX-Wert ist ungültig (z. B. #FF8800).", "error");
  if(filaments.some(f => f.color.toLowerCase() === color.toLowerCase() && f.material === material)){
    return addMessage("Diese Farbe gibt es mit diesem Material schon.", "error");
  }
  const base = DATABASE_URL.trim().replace(/\/+$/, "");
  if(!/^https:\/\/.+/.test(base)) return addMessage("DATABASE_URL fehlt im Code.", "error");

  $("saveBtn").disabled = true;
  addMessage("Speichere …");
  try{
    const res = await fetch(`${base}/${PFAD}.json`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({color, material, hex})
    });
    if(res.status === 401 || res.status === 403){
      throw new Error("Schreiben nicht erlaubt. In den Firebase-Regeln muss Schreiben für „" + PFAD + "“ erlaubt sein.");
    }
    if(!res.ok) throw new Error("Serverantwort " + res.status);
    $("newColor").value = "";
    addMessage("„" + color + "“ wurde gespeichert.", "ok");
    await load();
  }catch(error){
    addMessage("Fehler beim Speichern: " + error.message, "error");
  }finally{
    $("saveBtn").disabled = false;
  }
});

$("search").addEventListener("input", render);
$("materialFilter").addEventListener("change", render);

load().then(ok => { if(ok) setInterval(load, AKTUALISIERUNG_SEK * 1000); });
</script>
</body>
</html>
