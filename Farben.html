<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filament-Farben</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0e0c; --surface: #1a1916; --surface2: #242220; --border: #2e2c28;
      --accent: #e8c97e; --text: #f0ece4; --muted: #7a7468;
      --danger: #c0614a; --success: #6a9e72; --radius: 12px;
      --dual-angle: 135deg; /* Richtung der Teilung bei Dualfarben */
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1000; opacity: 0.6;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }

    /* Header */
    header { border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 70px; position: sticky; top: 0; background: rgba(15,14,12,0.92); backdrop-filter: blur(12px); z-index: 100; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.02em; color: var(--accent); }
    .logo span { color: var(--text); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1.1rem; border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 500; transition: all 0.18s ease; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-accent { background: var(--accent); color: #0f0e0c; font-weight: 600; }
    .btn-accent:hover { background: #f0d590; transform: translateY(-1px); }
    .btn-accent:disabled { opacity: 0.5; cursor: wait; transform: none; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn-danger:disabled { opacity: 0.5; cursor: wait; }
    .cancel-link { margin-top: 0.85rem; font-size: 0.78rem; color: var(--danger); cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; padding: 0; display: inline-block; }
    .cancel-link:hover { text-decoration: underline; }
    .btn-full { width: 100%; justify-content: center; }

    /* Layout */
    main { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem; }
    .hero { text-align: center; padding: 2rem 0 3rem; }
    .hero-tag { display: inline-block; background: rgba(232,201,126,0.1); border: 1px solid rgba(232,201,126,0.25); color: var(--accent); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 0.9rem; border-radius: 100px; margin-bottom: 1.25rem; }
    .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 900; line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 1rem; }
    .hero h1 em { font-style: italic; color: var(--accent); }
    .hero p { color: var(--muted); font-size: 1.05rem; max-width: 500px; margin: 0 auto; line-height: 1.7; }
    .stats-bar { display: flex; justify-content: center; gap: 3rem; padding: 1.5rem 2rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 3rem; }
    .stat { text-align: center; }
    .stat-value { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.1rem; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
    .section-header h2 { font-family: 'Playfair Display', serif; font-size: 1.75rem; font-weight: 700; }
    .filter-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .tab { padding: 0.35rem 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 0.8rem; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .tab.active, .tab:hover { background: var(--surface); color: var(--text); border-color: rgba(232,201,126,0.3); }
    .tab.active { color: var(--accent); }
    .search { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 0.85rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.18s; margin-bottom: 0.75rem; }
    .search:focus { border-color: var(--accent); }
    .search::placeholder { color: var(--muted); }
    .status { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.5rem; }
    .status.error { color: var(--danger); }

    /* Karten */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.5rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s, transform 0.2s; animation: fadeUp 0.4s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .card:hover { border-color: rgba(232,201,126,0.3); transform: translateY(-2px); }
    .swatch { width: 100%; aspect-ratio: 16/9; background: var(--surface2); border-bottom: 1px solid var(--border); }
    .card-body { padding: 1.25rem; }
    .card-category { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: 500; margin-bottom: 0.4rem; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 0.4rem; line-height: 1.2; overflow-wrap: anywhere; }
    .card-meta { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 500; }
    .badge-price { background: rgba(232,201,126,0.1); color: var(--accent); }
    .hex-list { border-top: 1px solid var(--border); padding-top: 0.85rem; margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .hex-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .hex-label { display: inline-flex; align-items: center; gap: 0.45rem; min-width: 0; }
    .hex-label code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.85rem; color: var(--text); }
    .hex-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15); }

    /* Kategorien */
    .cat-section { grid-column: 1 / -1; margin-top: 1rem; }
    .cat-section:first-child { margin-top: 0; }
    .cat-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.25rem; }
    .cat-label { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .cat-line { flex: 1; height: 1px; background: var(--border); }
    .empty { text-align: center; padding: 5rem 2rem; color: var(--muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--text); margin-bottom: 0.5rem; }

    /* Toast */
    .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 1100; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1.1rem; font-size: 0.875rem; display: flex; align-items: center; gap: 0.6rem; animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(20px); } }
    .toast.success { border-color: rgba(106,158,114,0.4); }
    .toast.error { border-color: rgba(192,97,74,0.4); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.visible { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 400px; transform: translateY(20px); transition: transform 0.2s; max-height: 100%; overflow-y: auto; }
    .modal-overlay.visible .modal { transform: translateY(0); }
    .modal p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; line-height: 1.6; }
    .modal h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 0.4rem; }
    .modal .modal-subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.25rem; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; }
    .modal input[type=text] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 0.85rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.18s; }
    .modal input[type=text]:focus { border-color: var(--accent); }
    .modal input::placeholder { color: var(--muted); }
    .form { display: flex; flex-direction: column; gap: 0.5rem; }
    .form label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; margin-top: 0.4rem; }
    .color-row { display: flex; gap: 0.5rem; align-items: center; }
    .color-row input[type=color] { flex: none; width: 46px; height: 42px; padding: 3px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
    .color-row input[type=text] { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .check { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.4rem; font-size: 0.875rem; color: var(--text); cursor: pointer; text-transform: none; letter-spacing: 0; }
    .check input { accent-color: var(--accent); width: 16px; height: 16px; }
    .form-err { font-size: 0.78rem; color: var(--danger); display: none; }
    .form-err.visible { display: block; }

    @media (max-width: 600px) {
      header { padding: 0 1rem; }
      main { padding: 2rem 1rem; }
      .stats-bar { gap: 1.5rem; padding: 1.25rem 1rem; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.85rem; }
      .card-body { padding: 0.9rem; }
      .card-title { font-size: 1.05rem; }
      .hex-row { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
<header>
  <div class="logo">Maxs<span>3d</span><span>Shop</span></div>
  <button class="btn btn-accent btn-sm" onclick="openAddModal()">+ Neue Farbe</button>
</header>

<main>
  <div class="hero">
    <div class="hero-tag">Filamente</div>
    <h1>Filament-<em>Farben</em></h1>
    <p>Farben, Materialien und HEX-Werte auf einen Blick.</p>
  </div>

  <div class="stats-bar">
    <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Farben</div></div>
    <div class="stat"><div class="stat-value" id="statDual">0</div><div class="stat-label">Dualfarben</div></div>
    <div class="stat"><div class="stat-value" id="statMat">0</div><div class="stat-label">Materialien</div></div>
  </div>

  <div class="section-header">
    <h2>Alle Farben</h2>
    <div class="filter-tabs" id="materialTabs"></div>
  </div>
  <input class="search" id="search" type="search" placeholder="Farbe, Material oder HEX suchen …" aria-label="Filamente suchen" />
  <p class="status" id="status">Lade Daten …</p>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>

<div class="toast-container" id="toastContainer"></div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>🎨 Neue Farbe</h3>
    <div class="modal-subtitle">Die Farbe wird in der Datenbank gespeichert.</div>
    <div class="form">
      <label for="newColor">Farbname</label>
      <input type="text" id="newColor" placeholder="z. B. Signalrot" maxlength="60" autocomplete="off" />
      <label for="newMaterial">Material</label>
      <input type="text" id="newMaterial" list="materials" placeholder="z. B. PLA" maxlength="30" autocomplete="off" />
      <datalist id="materials"></datalist>
      <label for="newHex">Farbe</label>
      <div class="color-row">
        <input type="color" id="newPicker" value="#e8c97e" aria-label="Farbe wählen" />
        <input type="text" id="newHex" value="#E8C97E" maxlength="7" aria-label="HEX-Wert" />
      </div>
      <label class="check"><input type="checkbox" id="newDual" /> Zweifarbig (Dual)</label>
      <div class="color-row" id="dualPick" hidden>
        <input type="color" id="newPicker2" value="#4aa3ff" aria-label="Zweite Farbe wählen" />
        <input type="text" id="newHex2" value="#4AA3FF" maxlength="7" aria-label="Zweiter HEX-Wert" />
      </div>
      <div class="form-err" id="addErr"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('addModal')">Abbrechen</button>
      <button class="btn btn-accent" id="saveBtn" onclick="saveColor()">Speichern</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h3>Farbe löschen?</h3>
    <p id="deleteText">Die Farbe wird unwiderruflich aus der Datenbank entfernt.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('deleteModal')">Behalten</button>
      <button class="btn btn-danger" id="deleteBtn" onclick="confirmDelete()">Löschen</button>
    </div>
  </div>
</div>

<script>
/* ===== Nur das hier eintragen: deine Realtime-Database-URL ===== */
const DATABASE_URL = "https://dshop-23436-default-rtdb.europe-west1.firebasedatabase.app/";

const PFAD = "filaments";      // Ordner in der Datenbank
const AKTUALISIERUNG_SEK = 20; // automatisch neu laden

const $ = id => document.getElementById(id);
const baseUrl = () => DATABASE_URL.trim().replace(/\/+$/, "");
let filaments = [], materialFilter = "";

function escHtml(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function validHex(v) { return typeof v === "string" && /^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()); }

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type === 'success' ? '✓' : '!'}</span> ${escHtml(msg)}`;
  $('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function setStatus(text, isError) { $('status').textContent = text; $('status').className = 'status' + (isError ? ' error' : ''); }

/* ===== Anzeige ===== */
function hexRow(code, showDot) {
  const dot = showDot ? `<span class="hex-dot" style="background:${code}"></span>` : '';
  return `<div class="hex-row"><span class="hex-label">${dot}<code>${code}</code></span><button class="btn btn-ghost btn-sm" data-hex="${code}">HEX kopieren</button></div>`;
}

function cardHTML(item) {
  const dual = Boolean(item.hex2);
  const bg = dual ? `linear-gradient(var(--dual-angle), ${item.hex} 50%, ${item.hex2} 50%)` : item.hex;
  const rows = [item.hex, item.hex2].filter(Boolean).map(c => hexRow(c, dual)).join('');
  return `<div class="card"><div class="swatch" style="background:${bg}"></div><div class="card-body">
    <div class="card-category">${escHtml(item.material || 'Material unbekannt')}</div>
    <div class="card-title">${escHtml(item.color)}</div>
    ${dual ? '<div class="card-meta"><span class="badge badge-price">◐ Dual</span></div>' : ''}
    <div class="hex-list">${rows}</div><button class="cancel-link" data-del="${escHtml(item.id)}">✕ Löschen</button></div></div>`;
}

function renderTabs() {
  const materials = [...new Set(filaments.map(f => f.material).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));
  if (materialFilter && !materials.includes(materialFilter)) materialFilter = '';
  const wrap = $('materialTabs');
  wrap.replaceChildren();
  ['', ...materials].forEach(m => {
    const b = document.createElement('button');
    b.className = 'tab' + (m === materialFilter ? ' active' : '');
    b.textContent = m || 'Alle';
    b.onclick = () => { materialFilter = m; renderTabs(); render(); };
    wrap.appendChild(b);
  });
  $('materials').replaceChildren(...materials.map(m => new Option(m)));
}

function render() {
  const words = $('search').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const items = filaments.filter(f =>
    (!materialFilter || f.material === materialFilter) &&
    words.every(w => `${f.color} ${f.material} ${f.hex} ${f.hex2}`.toLowerCase().includes(w))
  );
  const grid = $('grid');
  if (!items.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🎨</div><h3>Keine Farben gefunden</h3><p>Versuche eine andere Suche.</p></div>`;
    return;
  }
  const groups = {};
  items.forEach(f => { const cat = f.material || 'Sonstiges'; (groups[cat] = groups[cat] || []).push(f); });
  let html = '';
  Object.keys(groups).sort((a, b) => a.localeCompare(b, 'de')).forEach(cat => {
    html += `<div class="cat-section"><div class="cat-header"><span class="cat-label">${escHtml(cat)}</span><div class="cat-line"></div></div></div>`;
    groups[cat].forEach(f => { html += cardHTML(f); });
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.card').forEach((c, i) => c.style.animationDelay = `${Math.min(i, 12) * 0.04}s`);
}

function updateStats() {
  $('statTotal').textContent = filaments.length;
  $('statDual').textContent = filaments.filter(f => f.hex2).length;
  $('statMat').textContent = new Set(filaments.map(f => f.material).filter(Boolean)).size;
}

$('grid').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-hex]');
  if (!btn) return;
  try {
    await navigator.clipboard.writeText(btn.dataset.hex);
    btn.textContent = 'Kopiert!';
    setTimeout(() => btn.textContent = 'HEX kopieren', 1300);
  } catch { btn.textContent = btn.dataset.hex; }
});
$('grid').addEventListener('click', e => {
  const btn = e.target.closest('button[data-del]');
  if (btn) askDelete(btn.dataset.del);
});
$('search').addEventListener('input', render);

/* ===== Laden ===== */
async function load() {
  const base = baseUrl();
  if (!/^https:\/\/.+/.test(base)) { setStatus('Trage oben im Code bei DATABASE_URL deine Datenbank-URL ein.', true); return false; }
  try {
    const res = await fetch(`${base}/${PFAD}.json`);
    if (res.status === 401 || res.status === 403) throw new Error('Zugriff verweigert. In den Firebase-Regeln muss Lesen für „' + PFAD + '“ erlaubt sein.');
    if (!res.ok) throw new Error('Serverantwort ' + res.status);
    const data = await res.json() || {};
    filaments = Object.entries(data).map(([id, value]) => {
      const codes = [value?.hex, value?.hex2]
        .filter(v => typeof v === 'string')
        .flatMap(v => v.match(/#(?:[0-9a-f]{6}|[0-9a-f]{3})\b/gi) || [])
        .map(h => h.toUpperCase())
        .slice(0, 2);
      return {
        id,
        color: typeof value?.color === 'string' ? value.color : id,
        hex: codes[0] || '',
        hex2: codes[1] || '',
        material: typeof value?.material === 'string' ? value.material : ''
      };
    }).filter(f => f.hex).sort((a, b) => a.color.localeCompare(b.color, 'de'));
    setStatus(filaments.length ? 'Mit Firebase verbunden. Aktualisiert alle ' + AKTUALISIERUNG_SEK + ' Sekunden.' : 'Keine gültigen Filament-Einträge unter „' + PFAD + '“ gefunden.');
    renderTabs(); render(); updateStats();
    return true;
  } catch (error) {
    setStatus('Fehler beim Laden: ' + error.message, true);
    return false;
  }
}

/* ===== Neue Farbe ===== */
function openModal(id) { $(id).classList.add('visible'); }
function closeModal(id) { $(id).classList.remove('visible'); }
function openAddModal() { $('addErr').classList.remove('visible'); openModal('addModal'); setTimeout(() => $('newColor').focus(), 200); }
function addError(text) { $('addErr').textContent = text; $('addErr').classList.add('visible'); }

function bindPair(pickerId, hexId) {
  $(pickerId).addEventListener('input', () => { $(hexId).value = $(pickerId).value.toUpperCase(); });
  $(hexId).addEventListener('input', () => { const v = $(hexId).value.trim(); if (/^#[0-9a-f]{6}$/i.test(v)) $(pickerId).value = v; });
}
bindPair('newPicker', 'newHex');
bindPair('newPicker2', 'newHex2');
$('newDual').addEventListener('change', () => { $('dualPick').hidden = !$('newDual').checked; });

async function saveColor() {
  const color = $('newColor').value.trim();
  const material = $('newMaterial').value.trim();
  let hex = $('newHex').value.trim().toUpperCase();
  if (hex && !hex.startsWith('#')) hex = '#' + hex;
  const dual = $('newDual').checked;
  let hex2 = dual ? $('newHex2').value.trim().toUpperCase() : '';
  if (hex2 && !hex2.startsWith('#')) hex2 = '#' + hex2;

  if (!color) return addError('Bitte einen Farbnamen eingeben.');
  if (!validHex(hex)) return addError('Der HEX-Wert ist ungültig (z. B. #FF8800).');
  if (dual && !validHex(hex2)) return addError('Der zweite HEX-Wert ist ungültig.');
  if (filaments.some(f => f.color.toLowerCase() === color.toLowerCase() && f.material === material)) return addError('Diese Farbe gibt es mit diesem Material schon.');
  const base = baseUrl();
  if (!/^https:\/\/.+/.test(base)) return addError('DATABASE_URL fehlt im Code.');

  $('addErr').classList.remove('visible');
  $('saveBtn').disabled = true;
  try {
    const res = await fetch(`${base}/${PFAD}.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dual ? { color, material, hex, hex2 } : { color, material, hex })
    });
    if (res.status === 401 || res.status === 403) throw new Error('Schreiben nicht erlaubt. In den Firebase-Regeln muss Schreiben für „' + PFAD + '“ erlaubt sein.');
    if (!res.ok) throw new Error('Serverantwort ' + res.status);
    $('newColor').value = '';
    closeModal('addModal');
    toast(`„${color}“ gespeichert.`, 'success');
    await load();
  } catch (error) {
    addError('Fehler beim Speichern: ' + error.message);
  } finally {
    $('saveBtn').disabled = false;
  }
}

/* ===== Löschen ===== */
let deleteId = null;
function askDelete(id) {
  const f = filaments.find(x => x.id === id);
  if (!f) return;
  deleteId = id;
  $('deleteText').textContent = `„${f.color}${f.material ? ' – ' + f.material : ''}“ wird unwiderruflich aus der Datenbank entfernt.`;
  openModal('deleteModal');
}
async function confirmDelete() {
  if (!deleteId) return;
  const base = baseUrl();
  $('deleteBtn').disabled = true;
  try {
    const res = await fetch(`${base}/${PFAD}/${encodeURIComponent(deleteId)}.json`, { method: 'DELETE' });
    if (res.status === 401 || res.status === 403) throw new Error('Löschen nicht erlaubt. In den Firebase-Regeln muss Schreiben für „' + PFAD + '“ erlaubt sein.');
    if (!res.ok) throw new Error('Serverantwort ' + res.status);
    closeModal('deleteModal');
    toast('Farbe gelöscht.', 'success');
    deleteId = null;
    await load();
  } catch (error) {
    closeModal('deleteModal');
    toast(error.message, 'error');
  } finally {
    $('deleteBtn').disabled = false;
  }
}

document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('visible'); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.visible').forEach(m => m.classList.remove('visible')); });
$('newColor').addEventListener('keydown', e => { if (e.key === 'Enter') saveColor(); });

load().then(ok => { if (ok) setInterval(load, AKTUALISIERUNG_SEK * 1000); });
</script>
</body>
</html>
