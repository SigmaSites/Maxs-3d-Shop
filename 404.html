<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /*:root {
      --bg: #fafafa;
      --text: #111111;
      --muted: #333333;
      --card: #ffffff;
      --border: #e6e6e6;
      --btn: #000000;
      --btn-text: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      border: 1px solid var(--btn);
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.14); }
    .btn-dark { background: var(--btn); color: var(--btn-text); }
    .btn-light { background: #fff; color: var(--text); border-color: var(--border); }

    /* ---------- Hero ---------- *
    .hero {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      padding: 40px 56px;
      overflow: hidden;
    }


    /* full-screen color gradient: no white gaps, glow centered on the saucer *
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 55% 70% at 74% 58%, rgba(124,203,61,.55) 0%, rgba(124,203,61,0) 70%),
        linear-gradient(90deg,
          #f8efbf 0%,
          #f3dd85 24%,
          #efc75c 44%,
          #c3da4c 60%,
          #8fcf3f 72%,
          #a9de7c 86%,
          #d3efb7 100%);
    }

    .copy { position: relative; z-index: 2; max-width: 560px; }
    .copy h1 {
      margin: 0;
      font-size: clamp(64px, min(14vw, 20vh), 168px);
      line-height: .9;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .copy h2 {
      margin: 10px 0 16px;
      font-size: clamp(26px, min(4vw, 5.5vh), 44px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    .copy p {
      margin: 0 0 clamp(18px, 3vh, 28px);
      font-size: clamp(15px, 2.3vh, 19px);
      line-height: 1.5;
      color: var(--muted);
      max-width: 34em;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 14px; }

    .scene { position: relative; z-index: 2; display: flex; justify-content: center; align-self: stretch; height: 100%; min-height: 0; }
    .scene svg { width: 100%; max-width: 560px; height: 100%; overflow: visible; }

    /* gentle hover of the saucer + pulsing beam *
    .ufo { animation: hover 4.5s ease-in-out infinite; }
    .cursor { animation: lift 5s ease-in-out infinite; transform-origin: 300px 450px; }
    .shadow { animation: shade 5s ease-in-out infinite; transform-origin: 280px 540px; }
    .beam-glow { animation: glow 4.5s ease-in-out infinite; }
    @keyframes hover { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes lift {
      0%   { transform: translate(0, 0) rotate(0deg); }
      20%  { transform: translate(-22px, -30px) rotate(-9deg); }
      45%  { transform: translate(18px, -52px) rotate(8deg); }
      70%  { transform: translate(-14px, -34px) rotate(-6deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes shade {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      20%  { transform: translate(-6px, 0) scale(.92); opacity: .85; }
      45%  { transform: translate(5px, 0) scale(.8); opacity: .65; }
      70%  { transform: translate(-4px, 0) scale(.9); opacity: .8; }
      100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @keyframes glow  { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ufo, .cursor, .shadow, .beam-glow { animation: none; }
    }

    /* ---------- Responsive ---------- */
    @media (max-aspect-ratio: 1/1), (max-width: 600px) {
      .hero { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-content: center; padding: 24px; }
      .scene { margin-top: 8px; }
      body::before {
      
        background:
          radial-gradient(ellipse 80% 40% at 50% 78%, rgba(124,203,61,.55) 0%, rgba(124,203,61,0) 70%),
          linear-gradient(180deg, #f8efbf 0%, #f3dd85 30%, #efc75c 48%, #c3da4c 64%, #8fcf3f 78%, #a9de7c 90%, #d3efb7 100%);
      }
    }
  </style>
</head>
